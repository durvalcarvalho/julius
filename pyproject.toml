[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "julius"
version = "0.1.0"
description = "Memória pessoal de preços de mercado a partir de recibos NFC-e"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "rapidfuzz",
]

[project.scripts]
julius = "julius.cli:app"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["julius*"]

[tool.setuptools.package-data]
"julius.infra.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
